
name: Build Sky Studio

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Find and build mod
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f -name settings.gradle -not -path './.git/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find settings.gradle"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building project in: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" build --stacktrace

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: skystudio-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          exclude: '**/*-sources.jar'
